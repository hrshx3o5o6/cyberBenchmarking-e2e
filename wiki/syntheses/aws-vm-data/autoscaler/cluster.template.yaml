# Ray autoscaler config for the benchmark cluster (TEMPLATE). Layout: the head is an EXISTING VM that
# runs our own Ray head by hand (not created by `ray up`); the autoscaler on it launches and stops workers.
# Double-brace placeholders are filled by render_cluster.py from autoscaler.local.env (untracked).
# Every AWS resource is named explicitly: left blank, Ray would try to create a key pair, a security
# group (SSH open to the world) and an IAM role with full EC2 + S3 access, none of which we want.
#
# Run the rendered file ON THE HEAD: paths below (key, file_mounts sources) are paths on the head.
# Do NOT use `ray up` / `ray down` with this file: `ray down` would also stop the tagged head VM.
cluster_name: benchmark-ray
max_workers: {{MAX_WORKERS}}
upscaling_speed: 1.0
idle_timeout_minutes: {{IDLE_MINUTES}}

provider:
  type: aws
  region: us-east-1
  availability_zone: us-east-1c
  use_internal_ips: true          # the head reaches workers by private IP (same VPC)
  # true: scale-down STOPS an idle worker (its disk stays and bills; scale-up reuses it WITHOUT resyncing code).
  # false: scale-down TERMINATES an idle worker (disk deleted; every new worker gets the current code and data).
  # Only use false once tasks confirm their uploads to Postgres (observations_synced: true).
  cache_stopped_nodes: {{CACHE_STOPPED_NODES}}

auth:
  ssh_user: harshav
  ssh_private_key: {{SSH_KEY_PATH}}   # private half of the worker key pair, on the head, mode 600

available_node_types:
  head:
    # The existing VM. It also runs tasks, so it advertises its real CPUs and slots.
    # node_config is required by the schema but unused for a head we start by hand.
    resources: {CPU: {{HEAD_CPUS}}, benchmark_slot: {{HEAD_SLOTS}}}
    node_config:
      InstanceType: {{HEAD_TYPE}}
      ImageId: {{AMI_ID}}
      KeyName: {{KEY_NAME}}
      SubnetIds: [{{SUBNET_ID}}]
      SecurityGroupIds: [{{SECURITY_GROUP_ID}}]
  worker:
    min_workers: 0
    max_workers: {{MAX_WORKERS}}
    # CPUs and slots must match the instance size: the autoscaler plans node counts from these numbers.
    # Measured on 16 vCPUs: 8 to 10 light patch-only slots are comfortable, 16 saturates the CPU (about 0.5 slots per vCPU).
    resources: {CPU: {{WORKER_CPUS}}, benchmark_slot: {{SLOTS}}}
    node_config:
      InstanceType: {{WORKER_TYPE}}
      ImageId: {{AMI_ID}}
      KeyName: {{KEY_NAME}}
      SubnetIds: [{{SUBNET_ID}}]
      SecurityGroupIds: [{{SECURITY_GROUP_ID}}]
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: {{WORKER_DISK_GIB}}, VolumeType: gp3, DeleteOnTermination: true}
      TagSpecifications:
        - ResourceType: instance
          Tags: [{Key: project, Value: benchmark-ray}]
        - ResourceType: volume
          Tags: [{Key: project, Value: benchmark-ray}]

head_node_type: head

# Synced from the head to each new worker (local side = paths on the head). Secrets are never in the AMI.
file_mounts:
  /home/harshav/benchmark-evals/config/.env: {{LOCAL_ENV_FILE}}
  /home/harshav/benchmark-evals/config/.bedrock_key: {{LOCAL_BEDROCK_KEY_FILE}}
  /home/harshav/.ray/auth_token: {{LOCAL_RAY_TOKEN_FILE}}
  # code and run configuration come from the head, so a worker always runs the same runner code as the driver
  /home/harshav/benchmark-evals/src: {{LOCAL_SRC_DIR}}
  /home/harshav/benchmark-evals/config/{{MANIFEST_NAME}}: {{LOCAL_MANIFEST}}
  # our metering shim, the translation layer, the model registry and the script that starts a shim from it, and the task-data download
  # (the AMI holds only an older shim; these overwrite it on every new worker)
  /home/harshav/benchmark-evals/tools/llm_shim_new.py: {{LOCAL_TOOLS_DIR}}/llm_shim_new.py
  /home/harshav/benchmark-evals/tools/responses_chat.py: {{LOCAL_TOOLS_DIR}}/responses_chat.py
  /home/harshav/benchmark-evals/tools/model_registry.py: {{LOCAL_TOOLS_DIR}}/model_registry.py
  /home/harshav/benchmark-evals/tools/models.toml: {{LOCAL_TOOLS_DIR}}/models.toml
  /home/harshav/benchmark-evals/tools/start_shim.sh: {{LOCAL_TOOLS_DIR}}/start_shim.sh
  /home/harshav/benchmark-evals/tools/fetch_task_data.py: {{LOCAL_TOOLS_DIR}}/fetch_task_data.py
  /home/harshav/benchmark-evals/tools/mem_sampler.py: {{LOCAL_TOOLS_DIR}}/mem_sampler.py

initialization_commands: []
setup_commands: []                 # everything is baked into the AMI
head_setup_commands: []
worker_setup_commands:
  # until the AMI carries the Postgres library (AMI v4)
  - ~/.local/bin/uv pip install -q --python /home/harshav/benchmark-evals/.venv/bin/python 'psycopg[binary]'
  # task DATA this manifest needs (the HF token comes with the .env). The data is fetched before the node joins; the IMAGES are prefetched in the
  # background in manifest order (3 at a time, stopping at 150 GB free) so the node joins at once and its first tasks find most images already
  # pulled. A task whose image is still being pulled just waits on `docker run`, which pulls it itself (Docker shares layers between the two pulls).
  - cd /home/harshav/benchmark-evals && .venv/bin/python tools/fetch_task_data.py config/{{MANIFEST_NAME}}
  # node memory and load every 30 s into the shared Postgres node_metrics table (the data outlives the node); needs the psycopg install above
  - cd /home/harshav/benchmark-evals && set -a && . config/.env && set +a && nohup setsid .venv/bin/python tools/mem_sampler.py > /home/harshav/mem-sampler.log 2>&1 < /dev/null &
  - cd /home/harshav/benchmark-evals && nohup setsid .venv/bin/python tools/fetch_task_data.py config/{{MANIFEST_NAME}} --images-only > /home/harshav/prefetch-images.log 2>&1 < /dev/null &

# head_start_ray_commands only matter for `ray up`; for the existing VM start the head by hand, e.g.
#   1. prepare_cluster.py rendered/cluster.yaml rendered/cluster.prepared.yaml   (REQUIRED: without Ray's defaults the monitor dies with KeyError 'cluster_synced_files')
#   2. (set -a; . <the .env>; set +a)  so the head's Ray process carries SHIM_MASTER_KEY and CYBERGYM_DATABASE_URL, then
#      RAY_AUTH_MODE=token AUTOSCALER_METRIC_PORT=<free port> ray start --head --node-ip-address=<private ip> --port={{HEAD_PORT}} \
#        --ray-client-server-port=<free port> --num-cpus={{HEAD_CPUS}} --resources='{"benchmark_slot":{{HEAD_SLOTS}}}' --include-dashboard=false \
#        --autoscaling-config=<absolute path to cluster.prepared.yaml> --temp-dir=<short private dir>
#   Other Ray heads on the same VM already use the default metrics port, so give this one a free AUTOSCALER_METRIC_PORT.
#   3. (only for a Google model while there is no service account) the head's own shim and the token relay, then the Mac-side refresher:
#        TOKEN_FILE=$HOME/.secrets/vertex_token VERTEX_PROJECT=<project> bash tools/start_shim.sh <MODEL_REF> tokens
#        RELAY_TOKEN_FILE=$HOME/.secrets/vertex_token RELAY_BIND=<head private ip> MASTER_KEY=<SHIM_MASTER_KEY from the .env> python tools/token_relay.py
#        (Mac)  python3 tools/push_vertex_token.py --host harshav@<head public address> --key ~/.ssh/id_ed25519
#      Workers then fetch the token from the relay (WORKER_SHIM_ENV in the local env file sets TOKEN_URL and the project).
head_start_ray_commands: []

worker_start_ray_commands:
  - /home/harshav/benchmark-evals/.venv/bin/ray stop
  # NOTE: no space after the colon inside the resources JSON, or YAML reads the line as a mapping.
  # Resources are repeated here so the raylet matches what the autoscaler plans with.
  - {{WORKER_SHIM_ENV}} bash /home/harshav/benchmark-evals/tools/start_shim.sh {{MODEL_REF}} {{WORKER_SHIM_CAPS}} && set -a && . /home/harshav/benchmark-evals/config/.env && set +a && RAY_AUTH_MODE=token /home/harshav/benchmark-evals/.venv/bin/ray start --address=$RAY_HEAD_IP:{{HEAD_PORT}} --num-cpus={{WORKER_CPUS}} --resources='{"benchmark_slot":{{SLOTS}}}'
  # The shim is started by start_shim.sh from the model reference (the registry says where it sends calls); sourcing the .env puts the shim master key, the database URL and the other
  # variables into this node's Ray process (a Ray task sees its node's environment, NOT the driver's).
